name: Release

# Publishes to npm when a GitHub release is published; `pnpm release <version>`
# creates the release (see docs/releasing.md). The release tag must be `v` + the
# version in package.json (e.g. v0.3.0). npm trusts this workflow directly
# (trusted publishing, OIDC): no token is stored anywhere.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Proves to npm that this workflow is publishing (trusted publishing), and signs the provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node.js 22 (the version CI tests) ships npm 10
      - run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Check the release tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Release tag $GITHUB_REF_NAME doesn't match package.json version ($expected)"
            exit 1
          fi
      # prepublishOnly runs the typecheck, the tests and the package check before publishing
      # npm signs the provenance by itself with trusted publishing
      - run: npm publish --access public
