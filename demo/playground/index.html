<!doctype html>
<html lang="en" data-theme="signal">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EvEm Playground</title>
    <meta name="description" content="Try every EvEm feature against the real library, and see what it did and why." />
    <meta property="og:title" content="EvEm Playground" />
    <meta
      property="og:description"
      content="Try every EvEm feature against the real library, and see what it did and why."
    />
    <script>
      // Apply the saved theme before the page paints (same rules as resolveTheme in src/theme.ts)
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem('evem-theme');
        } catch (error) {}
        var light = window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = choice === 'signal-light' || (choice === 'system' && light) ? 'signal-light' : 'signal';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="icon" href="../src/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../src/styles.css" />
    <script type="module" src="../src/playground/main.ts"></script>
  </head>
  <body class="bg-base-200">
    <!-- The top bar: the scenarios in a megamenu (on phones, the Menu button opens it as a list), and the theme -->
    <header class="sticky top-0 z-30 bg-base-300">
      <nav class="mx-auto flex h-14 max-w-7xl items-center gap-2 px-4 lg:px-6" aria-label="Features">
        <a href="../" class="me-2 flex shrink-0 items-center gap-2 font-mono text-lg font-bold">
          <span class="inline-block size-3.5 rounded bg-primary" aria-hidden="true"></span>evem
          <span class="text-xs font-normal text-base-content/70">playground</span>
        </a>
        <button type="button" class="btn btn-ghost btn-sm lg:hidden" popovertarget="scenario-menu">Menu ▾</button>
        <div id="scenario-menu" class="megamenu max-lg:megamenu-vertical border-base-300 max-lg:border-b" popover></div>
        <p class="ms-auto hidden text-xs whitespace-nowrap text-base-content/70 md:block">
          Runs the library from source: %EVEM_VERSION%,
          <a class="link" href="%EVEM_COMMIT_URL%">%EVEM_COMMIT%</a>
        </p>
        <div id="theme-picker" class="ms-auto md:ms-0"></div>
      </nav>
    </header>
    <main id="workbench" class="mx-auto flex max-w-7xl flex-col gap-4 p-4 lg:h-[calc(100dvh-3.5rem)] lg:p-6"></main>
  </body>
</html>
